<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="DejaVu Sans, Verdana, sans-serif" role="img" aria-label="Five degrees of price elasticity of supply from Es zero to Es infinity">
<title>Five Kinds of Price Elasticity of Supply</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b1b1b"/></marker>
</defs>
<rect x="0" y="0" width="760" height="430" fill="#ffffff"/>
<g font-size="11" fill="#1b1b1b">
<g>
<text x="76" y="26" text-anchor="middle" font-size="13" font-weight="bold">Es = 0</text>
<text x="76" y="44" text-anchor="middle" font-size="11">Perfectly Inelastic</text>
<line x1="30" y1="330" x2="30" y2="70" stroke="#1b1b1b" stroke-width="1.3" marker-end="url(#arr)"/>
<line x1="30" y1="330" x2="145" y2="330" stroke="#1b1b1b" stroke-width="1.3" marker-end="url(#arr)"/>
<text x="22" y="84" text-anchor="end">P</text><text x="140" y="348">Q</text><text x="18" y="342">O</text>
<line x1="85" y1="90" x2="85" y2="330" stroke="#1f77b4" stroke-width="2.8"/>
<text x="76" y="372" text-anchor="middle" font-size="9.5">Same Q at all prices</text>
<text x="76" y="386" text-anchor="middle" font-size="9.5">Q = 20; P = 20, 30, 40</text>
<text x="76" y="404" text-anchor="middle" font-size="9.5" font-weight="bold">Vertical curve</text>
</g>
<g>
<text x="228" y="26" text-anchor="middle" font-size="13" font-weight="bold">Es &lt; 1</text>
<text x="228" y="44" text-anchor="middle" font-size="11">Less Elastic</text>
<line x1="182" y1="330" x2="182" y2="70" stroke="#1b1b1b" stroke-width="1.3" marker-end="url(#arr)"/>
<line x1="182" y1="330" x2="297" y2="330" stroke="#1b1b1b" stroke-width="1.3" marker-end="url(#arr)"/>
<text x="174" y="84" text-anchor="end">P</text><text x="292" y="348">Q</text><text x="170" y="342">O</text>
<line x1="212" y1="330" x2="252" y2="100" stroke="#1f77b4" stroke-width="2.8"/>
<text x="228" y="372" text-anchor="middle" font-size="9.5">%ΔQ (20%) &lt; %ΔP (50%)</text>
<text x="228" y="386" text-anchor="middle" font-size="9.5">P 10→15, Q 100→120</text>
<text x="228" y="404" text-anchor="middle" font-size="9.5" font-weight="bold">Steep curve</text>
</g>
<g>
<text x="380" y="26" text-anchor="middle" font-size="13" font-weight="bold">Es = 1</text>
<text x="380" y="44" text-anchor="middle" font-size="11">Unitary Elastic</text>
<line x1="334" y1="330" x2="334" y2="70" stroke="#1b1b1b" stroke-width="1.3" marker-end="url(#arr)"/>
<line x1="334" y1="330" x2="449" y2="330" stroke="#1b1b1b" stroke-width="1.3" marker-end="url(#arr)"/>
<text x="326" y="84" text-anchor="end">P</text><text x="444" y="348">Q</text><text x="322" y="342">O</text>
<line x1="334" y1="330" x2="429" y2="235" stroke="#1f77b4" stroke-width="2.8"/>
<circle cx="334" cy="330" r="4" fill="#1f77b4"/>
<text x="380" y="372" text-anchor="middle" font-size="9.5">%ΔQ (50%) = %ΔP (50%)</text>
<text x="380" y="386" text-anchor="middle" font-size="9.5">P 10→15, Q 100→150</text>
<text x="380" y="404" text-anchor="middle" font-size="9.5" font-weight="bold">Passes through origin</text>
</g>
<g>
<text x="532" y="26" text-anchor="middle" font-size="13" font-weight="bold">Es &gt; 1</text>
<text x="532" y="44" text-anchor="middle" font-size="11">Highly Elastic</text>
<line x1="486" y1="330" x2="486" y2="70" stroke="#1b1b1b" stroke-width="1.3" marker-end="url(#arr)"/>
<line x1="486" y1="330" x2="601" y2="330" stroke="#1b1b1b" stroke-width="1.3" marker-end="url(#arr)"/>
<text x="478" y="84" text-anchor="end">P</text><text x="596" y="348">Q</text><text x="474" y="342">O</text>
<line x1="494" y1="325" x2="594" y2="240" stroke="#1f77b4" stroke-width="2.8"/>
<text x="532" y="372" text-anchor="middle" font-size="9.5">%ΔQ (100%) &gt; %ΔP (50%)</text>
<text x="532" y="386" text-anchor="middle" font-size="9.5">P 10→15, Q 100→200</text>
<text x="532" y="404" text-anchor="middle" font-size="9.5" font-weight="bold">Flat curve</text>
</g>
<g>
<text x="684" y="26" text-anchor="middle" font-size="13" font-weight="bold">Es = ∞</text>
<text x="684" y="44" text-anchor="middle" font-size="11">Perfectly Elastic</text>
<line x1="638" y1="330" x2="638" y2="70" stroke="#1b1b1b" stroke-width="1.3" marker-end="url(#arr)"/>
<line x1="638" y1="330" x2="753" y2="330" stroke="#1b1b1b" stroke-width="1.3" marker-end="url(#arr)"/>
<text x="630" y="84" text-anchor="end">P</text><text x="748" y="348">Q</text><text x="626" y="342">O</text>
<line x1="638" y1="200" x2="748" y2="200" stroke="#1f77b4" stroke-width="2.8"/>
<text x="684" y="372" text-anchor="middle" font-size="9.5">Infinite Q at same price</text>
<text x="684" y="386" text-anchor="middle" font-size="9.5">P = 30; Q = 100–300</text>
<text x="684" y="404" text-anchor="middle" font-size="9.5" font-weight="bold">Horizontal curve</text>
</g>
</g>
</svg>
