<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" font-family="DejaVu Sans, Verdana, sans-serif" role="img" aria-label="Total revenue rises to maximum 30 at units 5 to 6 then falls to 28 at unit 7 under imperfect competition">
<title>Total Revenue Curve (Imperfect Competition)</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b1b1b"/></marker>
</defs>
<rect x="0" y="0" width="760" height="480" fill="#ffffff"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b1b1b">Total Revenue Curve (Imperfect Competition — Price Falls)</text>
<line x1="70" y1="400" x2="70" y2="50" stroke="#1b1b1b" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="70" y1="400" x2="720" y2="400" stroke="#1b1b1b" stroke-width="1.5" marker-end="url(#arr)"/>
<g stroke="#dddddd" stroke-width="1" stroke-dasharray="2,3">
<line x1="70" y1="347.5" x2="720" y2="347.5"/><line x1="70" y1="295" x2="720" y2="295"/><line x1="70" y1="242.5" x2="720" y2="242.5"/><line x1="70" y1="190" x2="720" y2="190"/><line x1="70" y1="137.5" x2="720" y2="137.5"/><line x1="70" y1="85" x2="720" y2="85"/>
</g>
<g font-size="11" fill="#1b1b1b" text-anchor="end">
<text x="62" y="404">0</text><text x="62" y="351">5</text><text x="62" y="299">10</text><text x="62" y="246">15</text><text x="62" y="194">20</text><text x="62" y="141">25</text><text x="62" y="89">30</text>
</g>
<g font-size="11" fill="#1b1b1b" text-anchor="middle">
<text x="70" y="420">0</text><text x="162.9" y="420">1</text><text x="255.7" y="420">2</text><text x="348.6" y="420">3</text><text x="441.4" y="420">4</text><text x="534.3" y="420">5</text><text x="627.1" y="420">6</text><text x="720" y="420">7</text>
</g>
<path d="M70,400 L162.9,295 L255.7,211 L348.6,148 L441.4,106 L534.3,85 L627.1,85 L720,106" fill="none" stroke="#1f77b4" stroke-width="2.8"/>
<g fill="#1f77b4">
<circle cx="162.9" cy="295" r="4.5"/><circle cx="255.7" cy="211" r="4.5"/><circle cx="348.6" cy="148" r="4.5"/><circle cx="441.4" cy="106" r="4.5"/><circle cx="534.3" cy="85" r="4.5"/><circle cx="627.1" cy="85" r="4.5"/><circle cx="720" cy="106" r="4.5"/>
</g>
<g font-size="10.5" fill="#1b1b1b" text-anchor="middle">
<text x="162.9" y="312">10</text><text x="255.7" y="228">18</text><text x="348.6" y="165">24</text><text x="441.4" y="123">28</text>
</g>
<line x1="534.3" y1="85" x2="534.3" y2="400" stroke="#d62728" stroke-width="1" stroke-dasharray="6,4"/>
<line x1="627.1" y1="85" x2="627.1" y2="400" stroke="#d62728" stroke-width="1" stroke-dasharray="6,4"/>
<text x="580.7" y="66" text-anchor="middle" font-size="12" font-weight="bold" fill="#d62728">Maximum TR = ₹30 at Q5–Q6 (MR = 0)</text>
<text x="250" y="330" text-anchor="middle" font-size="11.5" fill="#1b1b1b">TR rises while MR is positive</text>
<text x="700" y="132" text-anchor="middle" font-size="11.5" fill="#1b1b1b">TR falls at Q7 (MR = −2)</text>
<text x="24" y="225" font-size="12" fill="#1b1b1b" text-anchor="middle" transform="rotate(-90,24,225)">Total Revenue TR (₹)</text>
<text x="395" y="448" font-size="12" fill="#1b1b1b" text-anchor="middle">Units Sold (Q) — TR: 10, 18, 24, 28, 30, 30, 28</text>
</svg>
