<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" font-family="DejaVu Sans, Verdana, sans-serif" role="img" aria-label="MR horizontal at 12 with U-shaped MC crossing at R output 2 and K output 5 equilibrium">
<title>Producer Equilibrium — Price Constant (Points R and K)</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b1b1b"/></marker>
</defs>
<rect x="0" y="0" width="760" height="500" fill="#ffffff"/>
<text x="380" y="28" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#1b1b1b">Producer Equilibrium — Price Constant (P = ₹12)</text>
<text x="380" y="50" text-anchor="middle" font-size="12" fill="#555555">Schedule: MR = 12 at all outputs · MC = 13, 12, 9, 8, 12, 14</text>
<line x1="70" y1="410" x2="70" y2="60" stroke="#1b1b1b" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="70" y1="410" x2="720" y2="410" stroke="#1b1b1b" stroke-width="1.5" marker-end="url(#arr)"/>
<g stroke="#dddddd" stroke-width="1" stroke-dasharray="2,3">
<line x1="70" y1="366.3" x2="720" y2="366.3"/><line x1="70" y1="322.5" x2="720" y2="322.5"/><line x1="70" y1="278.8" x2="720" y2="278.8"/><line x1="70" y1="235" x2="720" y2="235"/><line x1="70" y1="191.3" x2="720" y2="191.3"/><line x1="70" y1="147.5" x2="720" y2="147.5"/><line x1="70" y1="103.8" x2="720" y2="103.8"/><line x1="70" y1="60" x2="720" y2="60"/>
</g>
<g font-size="11" fill="#1b1b1b" text-anchor="end">
<text x="62" y="414">0</text><text x="62" y="370">2</text><text x="62" y="326">4</text><text x="62" y="283">6</text><text x="62" y="239">8</text><text x="62" y="195">10</text><text x="62" y="151">12</text><text x="62" y="108">14</text><text x="62" y="64">16</text>
</g>
<g font-size="11" fill="#1b1b1b" text-anchor="middle">
<text x="178.3" y="430">1</text><text x="286.7" y="430">2</text><text x="395" y="430">3</text><text x="503.3" y="430">4</text><text x="611.7" y="430">5</text><text x="720" y="430">6</text>
</g>
<line x1="70" y1="147.5" x2="720" y2="147.5" stroke="#1f77b4" stroke-width="2.8"/>
<path d="M178.3,125.6 L286.7,147.5 L395,213.1 L503.3,235 L611.7,147.5 L720,103.8" fill="none" stroke="#d62728" stroke-width="2.8"/>
<g fill="#d62728">
<circle cx="178.3" cy="125.6" r="4.5"/><circle cx="286.7" cy="147.5" r="4.5"/><circle cx="395" cy="213.1" r="4.5"/><circle cx="503.3" cy="235" r="4.5"/><circle cx="611.7" cy="147.5" r="4.5"/><circle cx="720" cy="103.8" r="4.5"/>
</g>
<circle cx="286.7" cy="147.5" r="9" fill="none" stroke="#1b1b1b" stroke-width="2"/>
<circle cx="611.7" cy="147.5" r="9" fill="none" stroke="#1a5e4a" stroke-width="2.5"/>
<text x="286.7" y="122" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1b1b1b">R</text>
<text x="611.7" y="122" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a5e4a">K ★</text>
<text x="712" y="132" text-anchor="end" font-size="12.5" font-weight="bold" fill="#1f77b4">MR = ₹12 (horizontal)</text>
<text x="712" y="90" text-anchor="end" font-size="12.5" font-weight="bold" fill="#d62728">MC (U-shaped)</text>
<text x="286.7" y="330" text-anchor="middle" font-size="11" fill="#1b1b1b">R: MC=MR=12 but</text>
<text x="286.7" y="346" text-anchor="middle" font-size="11" fill="#1b1b1b">MC falls to 9 after ✗</text>
<text x="286.7" y="362" text-anchor="middle" font-size="11" fill="#1b1b1b">NOT equilibrium</text>
<text x="611.7" y="330" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a5e4a">K: MC=MR=12 and</text>
<text x="611.7" y="346" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a5e4a">MC rises to 14 after ✓</text>
<text x="611.7" y="362" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a5e4a">EQUILIBRIUM OQ=5, Profit ₹6</text>
<text x="24" y="235" font-size="12" fill="#1b1b1b" text-anchor="middle" transform="rotate(-90,24,235)">Revenue / Cost (₹)</text>
<text x="395" y="460" font-size="12" fill="#1b1b1b" text-anchor="middle">Output (units)</text>
<text x="395" y="480" font-size="11.5" fill="#555555" text-anchor="middle">MC cuts MR from below at K — both conditions met only at K</text>
</svg>
