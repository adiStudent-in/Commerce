<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" font-family="DejaVu Sans, Verdana, sans-serif" role="img" aria-label="Total revenue as a straight line from origin under perfect competition, TR equals 5, 10, 15, 20, 25">
<title>Total Revenue — Straight Line (Perfect Competition)</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b1b1b"/></marker>
</defs>
<rect x="0" y="0" width="760" height="480" fill="#ffffff"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b1b1b">Total Revenue (Perfect Competition — Price = ₹5 Constant)</text>
<line x1="70" y1="400" x2="70" y2="50" stroke="#1b1b1b" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="70" y1="400" x2="720" y2="400" stroke="#1b1b1b" stroke-width="1.5" marker-end="url(#arr)"/>
<g stroke="#dddddd" stroke-width="1" stroke-dasharray="2,3">
<line x1="70" y1="334" x2="720" y2="334"/><line x1="70" y1="268" x2="720" y2="268"/><line x1="70" y1="202" x2="720" y2="202"/><line x1="70" y1="136" x2="720" y2="136"/><line x1="70" y1="70" x2="720" y2="70"/>
</g>
<g font-size="11" fill="#1b1b1b" text-anchor="end">
<text x="62" y="404">0</text><text x="62" y="338">5</text><text x="62" y="272">10</text><text x="62" y="206">15</text><text x="62" y="140">20</text><text x="62" y="74">25</text>
</g>
<g font-size="11" fill="#1b1b1b" text-anchor="middle">
<text x="70" y="420">0</text><text x="200" y="420">1</text><text x="330" y="420">2</text><text x="460" y="420">3</text><text x="590" y="420">4</text><text x="720" y="420">5</text>
</g>
<line x1="70" y1="400" x2="720" y2="70" stroke="#1f77b4" stroke-width="2.8"/>
<g fill="#1f77b4">
<circle cx="200" cy="334" r="5"/><circle cx="330" cy="268" r="5"/><circle cx="460" cy="202" r="5"/><circle cx="590" cy="136" r="5"/><circle cx="720" cy="70" r="5"/>
</g>
<g font-size="11" fill="#1b1b1b">
<text x="208" y="328">5</text><text x="338" y="262">10</text><text x="468" y="196">15</text><text x="598" y="130">20</text>
</g>
<text x="700" y="62" text-anchor="end" font-size="12.5" font-weight="bold" fill="#1f77b4">TR = Q × P = 5Q</text>
<text x="395" y="230" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b1b1b">Straight line with constant slope</text>
<text x="395" y="252" text-anchor="middle" font-size="12" fill="#1b1b1b">Slope of TR = MR = ₹5 (constant) · TR starts from zero · TR = ΣMR</text>
<text x="24" y="225" font-size="12" fill="#1b1b1b" text-anchor="middle" transform="rotate(-90,24,225)">Total Revenue TR (₹)</text>
<text x="395" y="448" font-size="12" fill="#1b1b1b" text-anchor="middle">Units Sold (Q)</text>
</svg>
