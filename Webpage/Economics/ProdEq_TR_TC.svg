<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" font-family="DejaVu Sans, Verdana, sans-serif" role="img" aria-label="TR and TC curves with maximum vertical gap profit 6 at output 5 under TR-TC approach">
<title>Producer Equilibrium — TR-TC Approach</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b1b1b"/></marker>
</defs>
<rect x="0" y="0" width="760" height="500" fill="#ffffff"/>
<text x="380" y="28" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#1b1b1b">Producer Equilibrium — TR-TC Approach (Price = ₹12)</text>
<text x="380" y="50" text-anchor="middle" font-size="12" fill="#555555">TR: 12, 24, 36, 48, 60, 72 · TC: 13, 25, 34, 42, 54, 68 · Profit: −1, −1, 2, 6, 6, 4</text>
<line x1="70" y1="410" x2="70" y2="60" stroke="#1b1b1b" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="70" y1="410" x2="720" y2="410" stroke="#1b1b1b" stroke-width="1.5" marker-end="url(#arr)"/>
<g stroke="#dddddd" stroke-width="1" stroke-dasharray="2,3">
<line x1="70" y1="344.4" x2="720" y2="344.4"/><line x1="70" y1="278.8" x2="720" y2="278.8"/><line x1="70" y1="213.1" x2="720" y2="213.1"/><line x1="70" y1="147.5" x2="720" y2="147.5"/><line x1="70" y1="81.9" x2="720" y2="81.9"/>
</g>
<g font-size="11" fill="#1b1b1b" text-anchor="end">
<text x="62" y="414">0</text><text x="62" y="348">15</text><text x="62" y="283">30</text><text x="62" y="217">45</text><text x="62" y="151">60</text><text x="62" y="86">75</text>
</g>
<g font-size="11" fill="#1b1b1b" text-anchor="middle">
<text x="178.3" y="430">1</text><text x="286.7" y="430">2</text><text x="395" y="430">3</text><text x="503.3" y="430">4</text><text x="611.7" y="430">5</text><text x="720" y="430">6</text>
</g>
<line x1="611.7" y1="147.5" x2="611.7" y2="173.8" stroke="#1a5e4a" stroke-width="5"/>
<path d="M178.3,357.5 L286.7,305 L395,252.5 L503.3,200 L611.7,147.5 L720,95" fill="none" stroke="#1f77b4" stroke-width="2.8"/>
<path d="M178.3,353.1 L286.7,300.6 L395,261.3 L503.3,226.3 L611.7,173.8 L720,112.5" fill="none" stroke="#d62728" stroke-width="2.8"/>
<g fill="#1f77b4">
<circle cx="178.3" cy="357.5" r="4.5"/><circle cx="286.7" cy="305" r="4.5"/><circle cx="395" cy="252.5" r="4.5"/><circle cx="503.3" cy="200" r="4.5"/><circle cx="611.7" cy="147.5" r="4.5"/><circle cx="720" cy="95" r="4.5"/>
</g>
<g fill="#d62728">
<circle cx="178.3" cy="353.1" r="4.5"/><circle cx="286.7" cy="300.6" r="4.5"/><circle cx="395" cy="261.3" r="4.5"/><circle cx="503.3" cy="226.3" r="4.5"/><circle cx="611.7" cy="173.8" r="4.5"/><circle cx="720" cy="112.5" r="4.5"/>
</g>
<text x="712" y="80" text-anchor="end" font-size="12.5" font-weight="bold" fill="#1f77b4">TR</text>
<text x="712" y="136" text-anchor="end" font-size="12.5" font-weight="bold" fill="#d62728">TC</text>
<text x="640" y="166" text-anchor="start" font-size="11.5" font-weight="bold" fill="#1a5e4a">Max gap = Profit ₹6 ★</text>
<text x="640" y="184" text-anchor="start" font-size="11.5" fill="#1b1b1b">at output 5</text>
<text x="640" y="202" text-anchor="start" font-size="11.5" fill="#1b1b1b">(profit falls to ₹4 after)</text>
<text x="250" y="330" text-anchor="middle" font-size="11.5" fill="#1b1b1b">TC above TR: loss (−1)</text>
<text x="440" y="290" text-anchor="middle" font-size="11.5" fill="#1b1b1b">TR above TC: profit rises</text>
<text x="24" y="235" font-size="12" fill="#1b1b1b" text-anchor="middle" transform="rotate(-90,24,235)">Revenue / Cost (₹)</text>
<text x="395" y="460" font-size="12" fill="#1b1b1b" text-anchor="middle">Output (units)</text>
<text x="395" y="480" font-size="11.5" fill="#555555" text-anchor="middle">Conditions: (1) TR − TC maximum (2) profit falls after — both met at output 5</text>
</svg>
