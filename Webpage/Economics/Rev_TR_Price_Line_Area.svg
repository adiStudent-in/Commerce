<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" font-family="DejaVu Sans, Verdana, sans-serif" role="img" aria-label="Total revenue equals the area OPRQ under the horizontal price line">
<title>TR Equals Area Under Price Line</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b1b1b"/></marker>
</defs>
<rect x="0" y="0" width="760" height="480" fill="#ffffff"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b1b1b">TR = Area Under Price Line (MR Curve)</text>
<line x1="110" y1="400" x2="110" y2="60" stroke="#1b1b1b" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="110" y1="400" x2="700" y2="400" stroke="#1b1b1b" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="110" y="150" width="370" height="250" fill="#e8f0ec" stroke="#1a5e4a" stroke-width="1.5"/>
<line x1="110" y1="150" x2="660" y2="150" stroke="#1f77b4" stroke-width="3"/>
<line x1="480" y1="150" x2="480" y2="400" stroke="#1b1b1b" stroke-width="1.4" stroke-dasharray="7,5"/>
<g fill="#1f77b4">
<circle cx="660" cy="150" r="5"/>
</g>
<g font-size="13" font-weight="bold" fill="#1b1b1b">
<text x="98" y="154">P</text>
<text x="492" y="142">R</text>
<text x="98" y="414">O</text>
<text x="474" y="424">Q</text>
</g>
<text x="668" y="132" text-anchor="end" font-size="12.5" font-weight="bold" fill="#1f77b4">Price line = AR = MR</text>
<text x="295" y="282" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a5e4a">TR = OP × OQ</text>
<text x="295" y="306" text-anchor="middle" font-size="12.5" fill="#1b1b1b">= area OPRQ under the price line</text>
<text x="80" y="275" font-size="11.5" fill="#1b1b1b" text-anchor="middle" transform="rotate(-90,80,275)">Height = OP (price)</text>
<text x="295" y="444" font-size="11.5" fill="#1b1b1b" text-anchor="middle">Width = OQ (quantity)</text>
<text x="560" y="250" text-anchor="middle" font-size="12" fill="#1b1b1b">At OQ output,</text>
<text x="560" y="270" text-anchor="middle" font-size="12" fill="#1b1b1b">TR = ΣMR</text>
<text x="30" y="230" font-size="12" fill="#1b1b1b" text-anchor="middle" transform="rotate(-90,30,230)">Price / AR</text>
<text x="405" y="444" font-size="12" fill="#1b1b1b" text-anchor="middle" opacity="0">.</text>
</svg>
