<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" font-family="DejaVu Sans, Verdana, sans-serif" role="img" aria-label="Horizontal AR equals MR equals Price line at 5 rupees under perfect competition">
<title>AR = MR = Price (Perfect Competition)</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b1b1b"/></marker>
</defs>
<rect x="0" y="0" width="760" height="480" fill="#ffffff"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b1b1b">AR = MR = Price (Perfect Competition — Price Constant)</text>
<line x1="70" y1="400" x2="70" y2="50" stroke="#1b1b1b" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="70" y1="400" x2="720" y2="400" stroke="#1b1b1b" stroke-width="1.5" marker-end="url(#arr)"/>
<g stroke="#dddddd" stroke-width="1" stroke-dasharray="2,3">
<line x1="70" y1="350" x2="720" y2="350"/><line x1="70" y1="300" x2="720" y2="300"/><line x1="70" y1="250" x2="720" y2="250"/><line x1="70" y1="200" x2="720" y2="200"/><line x1="70" y1="150" x2="720" y2="150"/><line x1="70" y1="100" x2="720" y2="100"/><line x1="70" y1="50" x2="720" y2="50"/>
</g>
<g font-size="11" fill="#1b1b1b" text-anchor="end">
<text x="62" y="404">0</text><text x="62" y="354">1</text><text x="62" y="304">2</text><text x="62" y="254">3</text><text x="62" y="204">4</text><text x="62" y="154">5</text><text x="62" y="104">6</text><text x="62" y="54">7</text>
</g>
<g font-size="11" fill="#1b1b1b" text-anchor="middle">
<text x="70" y="420">0</text><text x="178.3" y="420">1</text><text x="286.7" y="420">2</text><text x="395" y="420">3</text><text x="503.3" y="420">4</text><text x="611.7" y="420">5</text><text x="720" y="420">6</text>
</g>
<line x1="70" y1="150" x2="720" y2="150" stroke="#1f77b4" stroke-width="3"/>
<g fill="#1f77b4">
<circle cx="178.3" cy="150" r="5"/><circle cx="286.7" cy="150" r="5"/><circle cx="395" cy="150" r="5"/><circle cx="503.3" cy="150" r="5"/><circle cx="611.7" cy="150" r="5"/>
</g>
<text x="712" y="130" text-anchor="end" font-size="12.5" font-weight="bold" fill="#1f77b4">AR = MR = Price = ₹5</text>
<text x="395" y="212" text-anchor="middle" font-size="12" fill="#1b1b1b">Any quantity can be sold at the same price ₹5</text>
<text x="395" y="234" text-anchor="middle" font-size="12" fill="#1b1b1b">Perfectly elastic demand (Ed = ∞) — firm is a price taker</text>
<text x="24" y="225" font-size="12" fill="#1b1b1b" text-anchor="middle" transform="rotate(-90,24,225)">Price / Revenue (₹)</text>
<text x="395" y="448" font-size="12" fill="#1b1b1b" text-anchor="middle">Units Sold (Q)</text>
</svg>
