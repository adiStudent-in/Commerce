<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" font-family="DejaVu Sans, Verdana, sans-serif" role="img" aria-label="Individual supply curve sloping upward from price Re 1 to Rs 6">
<title>Individual Supply Curve</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b1b1b"/></marker>
</defs>
<rect x="0" y="0" width="760" height="480" fill="#ffffff"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b1b1b">Individual Supply Curve</text>
<line x1="70" y1="400" x2="70" y2="50" stroke="#1b1b1b" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="70" y1="400" x2="720" y2="400" stroke="#1b1b1b" stroke-width="1.5" marker-end="url(#arr)"/>
<g stroke="#dddddd" stroke-width="1" stroke-dasharray="2,3">
<line x1="70" y1="350" x2="720" y2="350"/><line x1="70" y1="300" x2="720" y2="300"/><line x1="70" y1="250" x2="720" y2="250"/><line x1="70" y1="200" x2="720" y2="200"/><line x1="70" y1="150" x2="720" y2="150"/><line x1="70" y1="100" x2="720" y2="100"/><line x1="70" y1="50" x2="720" y2="50"/>
</g>
<g font-size="11" fill="#1b1b1b" text-anchor="end">
<text x="62" y="404">0</text><text x="62" y="354">1</text><text x="62" y="304">2</text><text x="62" y="254">3</text><text x="62" y="204">4</text><text x="62" y="154">5</text><text x="62" y="104">6</text><text x="62" y="54">7</text>
</g>
<g font-size="11" fill="#1b1b1b" text-anchor="middle">
<text x="70" y="420">0</text><text x="178.3" y="420">5</text><text x="286.7" y="420">10</text><text x="395" y="420">15</text><text x="503.3" y="420">20</text><text x="611.7" y="420">25</text><text x="720" y="420">30</text>
</g>
<line x1="70" y1="354" x2="655" y2="84" stroke="#1f77b4" stroke-width="2.8"/>
<g fill="#1f77b4">
<circle cx="70" cy="354" r="5"/><circle cx="178.3" cy="304" r="5"/><circle cx="286.7" cy="254" r="5"/><circle cx="395" cy="204" r="5"/><circle cx="503.3" cy="154" r="5"/><circle cx="611.7" cy="104" r="5"/>
</g>
<g font-size="10.5" fill="#1b1b1b">
<text x="186" y="300">5</text><text x="294" y="250">10</text><text x="403" y="200">15</text><text x="511" y="150">20</text><text x="619" y="100">25</text>
</g>
<text x="668" y="76" font-size="13" font-weight="bold" fill="#1f77b4">S</text>
<text x="668" y="94" font-size="13" font-weight="bold" fill="#1f77b4">S</text>
<text x="250" y="372" text-anchor="middle" font-size="11.5" fill="#1b1b1b">At Re 1, supply is zero — curve starts on the price axis</text>
<text x="500" y="209" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1b1b1b">Upward slope: price up → supply up</text>
<text x="24" y="225" font-size="12" fill="#1b1b1b" text-anchor="middle" transform="rotate(-90,24,225)">Price (Rs)</text>
<text x="395" y="448" font-size="12" fill="#1b1b1b" text-anchor="middle">Quantity Supplied of Good X (units) — 0, 5, 10, 15, 20, 25</text>
</svg>
