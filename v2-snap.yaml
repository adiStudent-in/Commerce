          - generic [ref=e975]:
            - strong [ref=e976]: Q2. State Law of DMU.
            - text: More units consumed. MU from each successive unit falls.
          - generic [ref=e977]:
            - strong [ref=e978]: Q3. State single commodity equilibrium condition.
            - text: MUx = Px.
          - generic [ref=e979]:
            - strong [ref=e980]: Q4. State two commodity equilibrium condition.
            - text: MUx / Px = MUy / Py = MUm. MU falls with consumption.
          - generic [ref=e981]:
            - strong [ref=e982]: Q5. Why is IC convex to origin?
            - text: MRS diminishes due to Law of DMU.
          - generic [ref=e983]:
            - strong [ref=e984]: Q6. Why does IC slope downwards?
            - text: More of one good needs less of other good to keep satisfaction same.
          - generic [ref=e985]:
