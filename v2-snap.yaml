        - heading "11. Assumptions of Indifference Curve Analysis" [level=2] [ref=e682]
        - paragraph [ref=e683]: "Follow four assumptions:"
        - list [ref=e684]:
          - listitem [ref=e685]:
            - strong [ref=e686]: "Two commodities:"
            - text: Consumer has fixed money. Spend whole money on two goods. Prices are constant.
          - listitem [ref=e687]:
            - strong [ref=e688]: "Non-satiety:"
            - text: Consumer has not reached saturation. Consumer prefers more of both goods. Choice is monotonic. Always move to higher IC for higher satisfaction.
          - listitem [ref=e689]:
            - strong [ref=e690]: "Ordinal utility:"
            - text: Consumer ranks preferences. Consumer ranks each bundle by satisfaction.
          - listitem [ref=e691]:
            - strong [ref=e692]: "Diminishing MRS:"
            - text: MRS falls. So IC is convex to origin.
          - listitem [ref=e693]:
            - strong [ref=e694]: "Rational consumer:"
            - text: Consumer behaves rationally. Aim is maximum satisfaction.
        - group [ref=e695]:
