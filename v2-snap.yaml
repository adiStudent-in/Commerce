        - heading "8. Consumer Equilibrium — Two Commodities" [level=2] [ref=e479]
        - paragraph [ref=e480]:
          - text: In real life, consumer consumes more than one commodity. Use
          - strong [ref=e481]: Law of Equi-Marginal Utility
          - text: for optimum allocation.
        - paragraph [ref=e482]: "Other names:"
        - list [ref=e483]:
          - listitem [ref=e484]: Law of Substitution
          - listitem [ref=e485]: Law of Maximum Satisfaction
          - listitem [ref=e486]:
            - strong [ref=e487]: Gossen's Second Law
        - paragraph [ref=e488]: Takes all assumptions of Law of DMU.
        - heading "8.1 Conditions" [level=3] [ref=e489]
        - paragraph [ref=e490]: "Two conditions are necessary:"
        - list [ref=e491]:
          - listitem [ref=e492]: Ratio of MU to Price is same for both goods.
          - listitem [ref=e493]: MU falls as consumption increases.
        - paragraph [ref=e494]: "Derivation:"
        - list [ref=e495]:
          - listitem [ref=e496]: Consumer of X alone is at equilibrium when MUx / MUm = Px.
          - listitem [ref=e497]: Consumer of Y alone is at equilibrium when MUy / MUm = Py.
