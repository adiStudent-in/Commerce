        - heading "12. Properties of Indifference Curve" [level=2] [ref=e700]
        - heading "12.1 Convex to Origin" [level=3] [ref=e701]
        - paragraph [ref=e702]: IC is convex to origin because MRS diminishes. MRS declines due to Law of DMU. MRS shows slope of IC.
        - heading "12.2 Slopes Downwards" [level=3] [ref=e703]
        - paragraph [ref=e704]: "IC slopes downwards from left to right. More of one good needs less of other good. Example: More apples need fewer bananas. Satisfaction stays same."
        - heading "12.3 Higher IC Means Higher Satisfaction" [level=3] [ref=e705]
        - paragraph [ref=e706]: "Higher IC has larger bundle. Monotonic preference gives more utility. Example: Point A on IC1 has OR of X and OP of Y. Point B on IC2 has OS of X and OP of Y. OS is more than OR. Satisfaction at B is more."
        - heading "12.4 Two ICs Never Intersect" [level=3] [ref=e707]
        - paragraph [ref=e708]: Two ICs cannot show same satisfaction level. So they cannot intersect. Only one IC passes through a point.
        - paragraph [ref=e709]: "Proof: IC1 and IC2 intersect at A. Take B on IC1. Take C on IC2. A = B in satisfaction. A = C in satisfaction. Then B = C. This is impossible. B and C are on different curves with different satisfaction."
        - heading "12.5 Never Touches Axes" [level=3] [ref=e710]
        - paragraph [ref=e711]: Analysis assumes two goods are always consumed.
        - list [ref=e712]:
          - listitem [ref=e713]: Touch Y-axis means X consumption is zero.
          - listitem [ref=e714]: Touch X-axis means Y consumption is zero.
          - listitem [ref=e715]: So IC never touches any axis.
