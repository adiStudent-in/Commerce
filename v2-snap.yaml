        - heading "16. Fast Revision — One Page" [level=2] [ref=e951]
        - list [ref=e952]:
          - listitem [ref=e953]: Consumer buys for satisfaction. Aim is maximum satisfaction.
          - listitem [ref=e954]: Utility is want satisfying power. Measure in utils or money.
          - listitem [ref=e955]: Cardinal measures in numbers. Marshall gave it. Ordinal ranks only. Hicks and Allen gave it.
          - listitem [ref=e956]: TU is total from all units. MU is extra from last unit. MU = TUn - TUn-1.
          - listitem [ref=e957]: Positive MU means TU rises. Zero MU means TU maximum. Negative MU means TU falls.
          - listitem [ref=e958]: "Law of DMU means MU falls with more units. Other name: Gossen's First Law."
          - listitem [ref=e959]: Equilibrium means maximum satisfaction. No tendency to change.
          - listitem [ref=e960]: "Single good equilibrium: MUx = Px."
          - listitem [ref=e961]: "Two goods equilibrium: MUx / Px = MUy / Py. Other name: Gossen's Second Law."
          - listitem [ref=e962]: IC shows same satisfaction bundles. Map is family of ICs. Higher IC means higher satisfaction.
          - listitem [ref=e963]: MRS = ΔY / ΔX. MRS falls. IC is convex.
          - listitem [ref=e964]: IC slopes down. Never intersects. Never touches axes.
          - listitem [ref=e965]: "Budget line: M = PxQx + PyQy. Slope = Px / Py = MRE."
          - listitem [ref=e966]: ON line means full spending. INSIDE means underspending. OUTSIDE means unattainable.
          - listitem [ref=e967]: Income change = Shift. One price change = Rotation.
          - listitem [ref=e968]: "IC equilibrium: MRS = Px / Py. IC is convex."
