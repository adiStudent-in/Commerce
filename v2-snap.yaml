        - heading "1. Consumer" [level=2] [ref=e130]
        - blockquote [ref=e131]:
          - strong [ref=e132]: "Definition:"
          - text: A consumer is one who buys goods and services. A consumer buys for
          - strong [ref=e133]: satisfaction of wants
          - text: .
        - paragraph [ref=e134]: "Aim of consumer: Get maximum satisfaction. Spend income on various goods and services."
        - paragraph [ref=e135]: A consumer means individual. A consumer means group of individuals. A consumer means institutions.
        - paragraph [ref=e136]: "Two approaches to study consumer behaviour:"
        - list [ref=e137]:
          - listitem [ref=e138]:
            - strong [ref=e139]: Cardinal Utility Approach.
            - text: "Other name: Marshall's Utility Analysis."
          - listitem [ref=e140]:
            - strong [ref=e141]: Ordinal Utility Approach.
            - text: "Other name: Indifference Curve Analysis. Other name: Hicksian Analysis."
        - group [ref=e142]:
          - generic "CHECK — click to answer" [ref=e143] [cursor=pointer]:
            - strong [ref=e144]: CHECK — click to answer
          - text: "Say the definition of consumer in one sentence. Name the two approaches: Cardinal and Ordinal."
      - separator [ref=e145]
      - generic [ref=e146]:
        - heading "2. Utility" [level=2] [ref=e147]
        - blockquote [ref=e148]:
          - strong [ref=e149]: "Definition:"
          - text: Utility is
          - strong [ref=e150]: want satisfying power
          - text: of a commodity. It is satisfaction derived from consumption.
        - paragraph [ref=e151]: "Points about utility:"
        - list [ref=e152]:
          - listitem [ref=e153]: Utility differs from person to person. Thirsty person gets more utility from water.
          - listitem [ref=e154]: Utility differs from place to place.
          - listitem [ref=e155]: Utility differs from time to time. Ice-cream gives high utility in summer. Low utility in winter.
          - listitem [ref=e156]: Utility is not usefulness. Liquor harms health. Yet liquor has utility for an alcoholic.
          - listitem [ref=e157]: Satisfaction is not pleasure. Treatment of broken arm gives satisfaction. It gives no pleasure. It only relieves pain.
        - paragraph [ref=e158]: "How to measure utility:"
        - list [ref=e159]:
          - listitem [ref=e160]: Classical economists assumed utility is measurable in numbers.
          - listitem [ref=e161]:
            - text: Made imaginary unit called
            - strong [ref=e162]: Util
            - text: .
          - listitem [ref=e163]: "Example: Assign 20 utils to ice-cream. Assign 10 utils to chocolate. Then ice-cream is liked twice as much."
          - listitem [ref=e164]: Utils vary from person to person. So Marshall suggested money measurement.
          - listitem [ref=e165]: Measure utility by price consumer is willing to pay.
          - listitem [ref=e166]: "Example: Assume 1 util = 1 rupee. Then 20 utils = 20 rupees. 10 utils = 10 rupees."
          - listitem [ref=e167]: "Advantage: Compare utility and price in same units."
        - group [ref=e168]:
          - generic "CHECK — click to answer" [ref=e169] [cursor=pointer]:
            - strong [ref=e170]: CHECK — click to answer
          - text: "Give one example where utility differs by person: thirsty vs not thirsty for water. Give one example where utility is not usefulness: liquor for an alcoholic."
