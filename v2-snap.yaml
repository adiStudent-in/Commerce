      - generic [ref=e342]:
        - heading "5. Law of Diminishing Marginal Utility" [level=2] [ref=e343]
        - blockquote [ref=e344]:
          - strong [ref=e345]: Law of Diminishing Marginal Utility
          - text: states that as we consume more and more units of a commodity, utility derived from
          - strong [ref=e346]: each successive unit goes on decreasing
          - text: .
        - paragraph [ref=e347]:
          - text: Given by German Economist
          - strong [ref=e348]: H. H. Gossen
          - text: ". Other name:"
          - strong [ref=e349]: Gossen's First Law of Consumption
          - text: .
        - paragraph [ref=e350]: Applies to all goods and services. People prefer variety for this reason. More of same good gives less extra satisfaction.
        - generic [ref=e351]:
          - strong [ref=e352]: "Example:"
          - text: Thirsty person drinks water. First glass gives very high utility. Second glass gives less. Third glass gives still less.
        - heading "5.1 Assumptions of Law of DMU" [level=3] [ref=e353]
        - list [ref=e354]:
          - listitem [ref=e355]:
            - strong [ref=e356]: "Cardinal measurement:"
            - text: Utility is measurable. Consumer expresses satisfaction as 1, 2, 3.
          - listitem [ref=e357]:
            - strong [ref=e358]: "Monetary measurement:"
            - text: Utility is measurable in money. Need same units to compare MU and Price.
          - listitem [ref=e359]:
            - strong [ref=e360]: "Reasonable quantity:"
            - text: Consume proper quantity. Compare glassful with glassful. Do not compare spoon with glass. Spoonful gives rising MU.
          - listitem [ref=e361]:
            - strong [ref=e362]: "Continuous consumption:"
            - text: No time gap between units. Morning ice-cream and evening ice-cream break continuity.
          - listitem [ref=e363]:
            - strong [ref=e364]: "No change in quality:"
            - text: Quality stays same. Topped ice-cream may give more utility than plain.
          - listitem [ref=e365]:
            - strong [ref=e366]: "Rational consumer:"
            - text: Consumer calculates. Consumer compares utilities. Aim is maximum satisfaction.
          - listitem [ref=e367]:
            - strong [ref=e368]: "Independent utilities:"
            - text: MU of one commodity has no relation with MU of another. One person's utility does not affect another person's utility.
          - listitem [ref=e369]:
            - strong [ref=e370]: "MU of money remains constant:"
            - text: Spending reduces money left. Remaining money becomes dearer. MU of money should rise. Ignore this rise. Keep MU of money constant.
          - listitem [ref=e371]:
            - strong [ref=e372]: "Fixed income and prices:"
            - text: Income of consumer stays constant. Prices of goods stay constant.
        - group [ref=e373]:
          - generic "CHECK — click to answer" [ref=e374] [cursor=pointer]:
            - strong [ref=e375]: CHECK — click to answer
          - text: "Write any five assumptions from memory: cardinal measurement, reasonable quantity, continuous consumption, same quality, rational consumer."
      - separator [ref=e376]
      - generic [ref=e377]:
        - heading "6. Consumer's Equilibrium — Meaning" [level=2] [ref=e378]
        - blockquote [ref=e379]:
          - strong [ref=e380]: Consumer's Equilibrium
          - text: is a situation. Consumer gets
          - strong [ref=e381]: maximum satisfaction
          - text: with limited income. Consumer has
          - strong [ref=e382]: no tendency to change
          - text: his way of existing expenditure.
        - paragraph [ref=e383]: "Meaning of equilibrium: State of rest. Position of no change."
        - paragraph [ref=e384]: "Why change stops:"
        - list [ref=e385]:
          - listitem [ref=e386]: Consumer pays a price for each unit.
          - listitem [ref=e387]: So consumer cannot consume unlimited quantity.
          - listitem [ref=e388]: As per Law of DMU, utility from each successive unit falls.
          - listitem [ref=e389]: At same time, income also decreases with purchase.
          - listitem [ref=e390]: Rational consumer balances expenditure. Goal is maximum satisfaction with minimum expenditure.
          - listitem [ref=e391]: After this point, no incentive exists to change quantity purchased.
        - paragraph [ref=e392]: "Two situations:"
        - list [ref=e393]:
          - listitem [ref=e394]:
            - strong [ref=e395]: "Single Commodity:"
            - text: Spend entire income on one good.
          - listitem [ref=e396]:
            - strong [ref=e397]: "Two Commodities:"
            - text: Spend entire income on two goods.
        - group [ref=e398]:
          - generic "CHECK — click to answer" [ref=e399] [cursor=pointer]:
            - strong [ref=e400]: CHECK — click to answer
          - text: "Say the definition of consumer's equilibrium in one sentence: maximum satisfaction with limited income and no tendency to change."
